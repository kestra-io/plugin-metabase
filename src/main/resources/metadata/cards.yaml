group: io.kestra.plugin.metabase.cards
name: "cards"
title: "Metabase Cards"
description: "Run a saved Metabase question and fetch or store its rows."
body: "Use `cards.Run` with a `cardId` to run a saved question and return its rows inline or stream them to internal storage with `fetchType: STORE`. Requires the Metabase `url` and one authentication mode (`apiKey`, `sessionToken`, or `username` with `password`)."
