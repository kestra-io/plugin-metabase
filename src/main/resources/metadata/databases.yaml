group: io.kestra.plugin.metabase.databases
name: "databases"
title: "Metabase Databases"
description: "Refresh a Metabase database after new data is loaded."
body: "Use `databases.SyncSchema` to re-read a database schema and `databases.RescanValues` to refresh its field values, typically right after a pipeline loads new tables. Both take a `databaseId`, the Metabase `url`, and one authentication mode (`apiKey`, `sessionToken`, or `username` with `password`)."
